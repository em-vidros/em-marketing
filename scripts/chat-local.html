<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente EM Vidros · local</title>
<style>
  :root {
    --teal: #2F646A; --teal-claro: #63B5AF; --grafite: #414141;
    --fundo: #EEF1F0; --balao: #FFFFFF; --meu: #DCEDEB; --borda: #D5DBDA;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, sans-serif; color: var(--grafite); background: var(--fundo); height: 100dvh; display: flex; flex-direction: column; }
  header { background: var(--teal); color: #fff; padding: 12px 16px; display: flex; align-items: baseline; gap: 10px; }
  header b { font-size: 16px; }
  header span { opacity: .75; font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; background: var(--balao); white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 1px rgb(0 0 0 / .06); }
  .eu { align-self: flex-end; background: var(--meu); }
  .sistema { align-self: center; background: none; box-shadow: none; font-size: 13px; opacity: .6; }
  .botoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .botoes button { flex: 1; min-width: 90px; border: 1px solid var(--teal-claro); background: #fff; color: var(--teal); border-radius: 8px; padding: 7px 10px; font: inherit; cursor: pointer; }
  .botoes button:hover { background: var(--meu); }
  .botoes button:disabled { opacity: .45; cursor: default; }
  .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
  .fotos img { width: 100%; border-radius: 8px; display: block; }
  #digitando { font-size: 13px; opacity: .6; padding: 0 16px 6px; max-width: 760px; width: 100%; margin: 0 auto; visibility: hidden; }
  form { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid var(--borda); }
  form > div { display: flex; gap: 8px; max-width: 760px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 10px; font: inherit; font-size: 16px; }
  form button { border: 0; background: var(--teal); color: #fff; border-radius: 10px; padding: 0 18px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<header><b>Agente de marketing · EM Vidros</b><span>chat local, sem Telegram</span></header>
<div id="log"></div>
<div id="digitando">digitando…</div>
<form id="f"><div><input id="t" autocomplete="off" placeholder="Ex.: cria um post pro dia do vidraceiro" autofocus><button>Enviar</button></div></form>
<script>
  const log = document.getElementById("log");
  const digitando = document.getElementById("digitando");

  function bolha(cls) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    log.append(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  // Markdown v1 do Telegram: *negrito*, _itálico_, `código`.
  function markdown(el, text) {
    const re = /\*([^*\n]+)\*|_([^_\n]+)_|`([^`\n]+)`/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      el.append(text.slice(last, m.index));
      const tag = document.createElement(m[1] ? "b" : m[2] ? "i" : "code");
      tag.textContent = m[1] ?? m[2] ?? m[3];
      el.append(tag);
      last = re.lastIndex;
    }
    el.append(text.slice(last));
  }

  async function enviar(body) {
    digitando.style.visibility = "visible";
    await fetch("/send", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  }

  const es = new EventSource("/events");
  es.onopen = () => { if (!log.children.length) enviar({ text: "/start" }); };
  es.onmessage = (ev) => {
    const e = JSON.parse(ev.data);
    if (e.kind === "typing") { digitando.style.visibility = "visible"; return; }
    digitando.style.visibility = "hidden";
    const el = bolha("");
    if (e.kind === "text") {
      markdown(el, e.text);
      if (e.buttons) {
        const box = document.createElement("div");
        box.className = "botoes";
        for (const b of e.buttons.flat()) {
          const btn = document.createElement("button");
          btn.textContent = b.text;
          btn.onclick = () => {
            box.querySelectorAll("button").forEach((x) => (x.disabled = true));
            bolha("eu").textContent = b.text;
            enviar({ data: b.data });
          };
          box.append(btn);
        }
        el.append(box);
      }
    } else if (e.kind === "photos") {
      const grid = document.createElement("div");
      grid.className = "fotos";
      for (const p of e.paths) {
        const img = document.createElement("img");
        img.src = "/file?p=" + encodeURIComponent(p);
        grid.append(img);
      }
      el.append(grid);
      if (e.caption) el.append(e.caption);
    }
    log.scrollTop = log.scrollHeight;
  };
  es.onerror = () => { bolha("sistema").textContent = "conexão com o servidor caiu, recarregue a página"; es.close(); };

  document.getElementById("f").onsubmit = (ev) => {
    ev.preventDefault();
    const t = document.getElementById("t");
    const text = t.value.trim();
    if (!text) return;
    t.value = "";
    bolha("eu").textContent = text;
    enviar({ text });
  };

</script>
</body>
</html>
