name: deploy
on:
  push:
    branches: [main]
    # brand/ e styles/ ficam de fora: entram na imagem e são lidos em runtime
    paths-ignore:
      - 'docs/**'
      - '.specs/**'
      - 'README.md'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/em-vidros/em-marketing:latest
      - name: Trigger watchtower
        run: |
          curl -fsS -X POST --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            http://watchtower-prod:8080/v1/update
