name: deploy
on:
  push:
    branches: [main]
    # brand/ fica de fora: entra na imagem e é lida em runtime
    paths-ignore:
      - 'docs/**'
      - '.specs/**'
      - 'README.md'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # O estágio `verificar` do Dockerfile roda typecheck e as dez suítes; imagem
      # vermelha não chega a existir, então não há o que empurrar nem o que subir.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/em-vidros/em-marketing:latest
      # O watchtower só responde dentro da rede do servidor, que o runner hospedado não alcança.
      # Falhar aqui não derruba o job: a imagem já subiu e o watchtower puxa no próximo ciclo.
      - name: Trigger watchtower
        continue-on-error: true
        run: |
          curl -fsS -X POST --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            http://watchtower-prod:8080/v1/update
