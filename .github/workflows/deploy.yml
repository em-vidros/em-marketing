name: deploy
on:
  push:
    branches: [main]
    # brand/ e styles/ ficam de fora: entram na imagem e são lidos em runtime
    paths-ignore:
      - 'docs/**'
      - '.specs/**'
      - 'README.md'

jobs:
  verificar:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # Roda no mesmo base image do Dockerfile, com as mesmas fontes, porque a
      # determinância da arte depende do fontconfig do ambiente.
      - name: Arnês da fase 1
        run: |
          docker run --rm -v "$PWD":/app -w /app oven/bun:1.3-slim sh -c '
            set -e
            apt-get update >/dev/null
            apt-get install -y --no-install-recommends fontconfig >/dev/null
            mkdir -p /usr/share/fonts/truetype/emvidros
            cp brand/assets/fonts/*.ttf /usr/share/fonts/truetype/emvidros/
            fc-cache -f >/dev/null
            bun install --frozen-lockfile
            bun run typecheck
            bun run verificar
          '

  build-and-deploy:
    needs: verificar
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/em-vidros/em-marketing:latest
      - name: Trigger watchtower
        run: |
          curl -fsS -X POST --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            http://watchtower-prod:8080/v1/update
